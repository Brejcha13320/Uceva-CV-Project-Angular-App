<div class="auth-container">
  <div class="auth-card animate__animated animate__fadeInUp">
    <h3 class="text-center mb-4">Iniciar sesión</h3>
    <form [formGroup]="loginForm">
      <div class="form-floating mb-3">
        <input 
          type="email" 
          class="form-control" 
          id="loginEmail" 
          placeholder="Correo"
          formControlName="email"
          [ngClass]="{
            'is-invalid': isInvalid('email'),
            'is-valid': isValid('email')
          }"
        >
        <label for="loginEmail">Correo electrónico</label>
        <small *ngIf="isInvalid('email')" class="text-danger">
          El email es obligatorio
        </small>
      </div>
      <div class="form-floating mb-3">
        <input 
          type="password" 
          class="form-control" 
          id="loginPassword" 
          placeholder="Contraseña"
          formControlName="password"
          [ngClass]="{
            'is-invalid': isInvalid('password'),
            'is-valid': isValid('password')
          }"
        >
        <label for="loginPassword">Contraseña</label>
        <small *ngIf="isInvalid('password')" class="text-danger">
          La contraseña es obligatoria
        </small>
      </div>
      <div class="d-flex justify-content-start align-items-center mb-3">
        <div class="form-check">
          <input 
            class="form-check-input" 
            type="checkbox" 
            id="rememberMe"
            [(ngModel)]="rememberMe"
            [ngModelOptions]="{ standalone: true }"
            >
          <label class="form-check-label" for="rememberMe">
            Recordarme
          </label>
        </div>
      </div>
      <div class="d-flex flex-column gap-3" >
        <app-button text="Ingresar" type="primary" [fullWidth]="true" (onClick)="login()" />
        <app-button text="Crear Cuenta" type="success" [fullWidth]="true" (onClick)="redirectTo('/auth/register')" />
        <div class="d-flex justify-content-center">
          <app-button text="Olvide mi Contraseña" type="link" (onClick)="redirectTo('/auth/recover-password')" />
        </div>
      </div>
    </form>
  </div>
</div>

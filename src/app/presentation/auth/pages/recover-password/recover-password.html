<div class="auth-container">
    <div class="auth-card animate__animated animate__fadeInUp">
        <h3 class="text-center mb-4">Recuperar Contraseña</h3>
        @if(!recoverSuccess){
            <form [formGroup]="recoverPasswordForm">
                <div class="form-floating mb-3">
                    <input 
                    type="email" 
                    class="form-control" 
                    id="registerEmail" 
                    placeholder="Correo"
                    formControlName="email"
                    [ngClass]="{
                        'is-invalid': isInvalid('email'),
                        'is-valid': isValid('email')
                    }"
                    >
                    <label for="registerEmail">Correo electrónico</label>
                    <small *ngIf="isInvalid('email')" class="text-danger">
                        El email es obligatorio
                    </small>
                </div>
            </form>
        } @else {
            <app-alert [text]="alertText" [type]="alertType"  />
        }
        <div class="d-flex flex-column gap-3" >
            @if(recoverSuccess){
                <app-button text="Volver a Intentar" type="primary" [fullWidth]="true" (onClick)="tryAgain()" />
            } @else {
                <app-button text="Recuperar Contraseña" type="primary" [fullWidth]="true" (onClick)="recoverPassword()" />
            }
            <app-button text="Iniciar Sesión" type="success" [fullWidth]="true" (onClick)="redirectTo('/auth/login')" />
        </div>
    </div>
</div>
